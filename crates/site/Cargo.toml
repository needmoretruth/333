[package]
name = "n333-site"
description = "What runs the333.dev: the meeting point, the site's pages, the public observation of the site's node, and the loop that deploys it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Runs on one machine for one site. It is not part of what a node operator installs.
publish = false

[[bin]]
name = "333-site"
path = "src/main.rs"

[dependencies]
n333-core.workspace = true
# Only for the length prefix and the record limit a node's logs are written with, so
# that the observer reads them by the same numbers they were written by.
n333-store.workspace = true
anyhow.workspace = true
# `env` lets the observer's unit hand over the site node's name and invitation from an
# environment file. A feature of a crate already in the tree; no crate added.
clap = { workspace = true, features = ["env"] }
humantime.workspace = true
# The pages' words, in the same catalogs and the same format as the client's, read by
# the same crates at the same versions. Already in the tree through the client.
fluent-bundle.workspace = true
fluent-syntax.workspace = true
# The one request `deploy` sends after a switch: telling search engines which pages
# changed (IndexNow). Already in the tree through the client's meeting point, with the
# same features; it is the site binary that newly links it.
ureq.workspace = true
rand_core.workspace = true
serde.workspace = true
# `raw_value` keeps the node's own `status --json` byte for byte inside the observation
# instead of re-ordering its keys. A feature of a crate already in the tree; no crate added.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Declared here rather than in [workspace.dependencies]: nothing that ships to node
# operators should be able to reach them with `.workspace = true`. All of them are
# already in the tree (through arti and ureq), so none adds a licence to account for.
# hyper is the HTTP/1 server, and only the server half is turned on here. MIT.
hyper = { version = "1.10.1", features = ["server", "http1"] }
# The glue between hyper and tokio's sockets and timers. MIT.
hyper-util = { version = "0.1.20", features = ["tokio"] }
# A body that is one buffer, and a limit on how much of a request body is read. MIT.
http-body-util = "0.1.3"
# The keyed hash that turns a visitor's address into a name nobody can turn back. MIT OR Apache-2.0.
hmac = "0.12.1"
# How a frame is kept inside the board's JSON file. MIT OR Apache-2.0.
base64 = "0.22.1"

[lints]
workspace = true
