[package]
name = "n333-cli"
description = "333 command line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "333"
path = "src/main.rs"

[features]
# Arti is bundled by default, and nothing starts it unless an address asks for Tor.
# The smallest edition builds with --no-default-features, which drops it entirely.
default = ["tor"]
tor = ["n333-net/tor"]

[dependencies]
n333-core.workspace = true
n333-net.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
fs-mistrust.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
