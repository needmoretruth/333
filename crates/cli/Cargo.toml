[package]
name = "n333-cli"
description = "333 command line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "333"
path = "src/main.rs"

[features]
# Arti is bundled by default, and nothing starts it unless an address asks for Tor.
# The smallest edition builds with --no-default-features, which drops it entirely.
default = ["tor", "screen"]
tor = ["n333-net/tor"]
# The Standard edition's screen. Dropping it leaves the client saying the same
# things in lines, which is what a machine with no terminal to look at wants.
screen = ["dep:ratatui"]

[dependencies]
n333-core.workspace = true
n333-net.workspace = true
n333-store.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
ratatui = { workspace = true, optional = true }
fs-mistrust.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
