# /etc/systemd/system/caddy.service.d/restart.conf
# The packaged unit leaves Caddy down if it ever exits with an error; on a machine
# nobody logs in to, that is the site down until somebody notices.
#
#   sudo install -D -m 0644 packaging/vps/caddy-restart.conf /etc/systemd/system/caddy.service.d/restart.conf
#   sudo systemctl daemon-reload

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5
