# Every push and every proposal, checked the way it is checked by hand.
#
# Pinned to the oldest compiler the workspace claims to support, so that the claim is
# tested rather than asserted. A newer compiler is welcome to be newer.
name: check

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
      - run: rustup default 1.96.0
      - run: sudo apt-get update
      - run: sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --locked
