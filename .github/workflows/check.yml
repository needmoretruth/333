# Every push and every proposal, checked the way it is checked by hand.
#
# Pinned to the oldest compiler the workspace claims to support, so that the claim is
# tested rather than asserted. A newer compiler is welcome to be newer.
name: check

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
      - run: rustup default 1.96.0
      - run: sudo apt-get update
      - run: sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --no-default-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # A ratchet, not a verdict: the licences the released graph carries today, frozen
      # in crates/notices/src/ratchet.rs. A dependency that brings a new one stops here
      # with its name, so that taking it is a decision somebody wrote down rather than
      # something a `cargo update` did. GPL, AGPL, SSPL and BUSL are refused even as one
      # choice among several, and the LGPL is taken only beside something else.
      - name: No licence the tree has not carried before
        run: cargo run -p n333-notices --locked -- --licences
      # The released binaries are statically linked and carry five hundred-odd other
      # people's packages, whose licences ask that their notices go along with the
      # copies. THIRD-PARTY.md is that, generated from the dependency graph rather
      # than kept by hand, because a hand-kept one goes stale on the first `cargo
      # update` and nobody finds out. Last, because the licence text is read out of
      # the extracted registry sources that the commands above have already fetched
      # most of; it fetches the rest itself, which is slower than it needs to be here.
      - name: The third-party notices still match the dependencies
        run: cargo run -p n333-notices --locked -- --check

  # Files are built for macOS and Windows on every release, and without these two jobs
  # nothing compiles that code, let alone tests it, until somebody pushes a tag. Same
  # compiler as above. macOS brings its own TLS and SQLite; Windows brings neither, so
  # it is built the way the README says to build it there, with both compiled in.
  macos:
    name: macOS, clippy and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy --no-self-update
      - run: rustup default 1.96.0
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows:
    name: Windows, clippy and tests
    runs-on: windows-latest
    steps:
      # Checked out byte for byte, as on the other two. Git on these machines turns line
      # endings into CRLF by default, and a test that pins a file's bytes would then be
      # testing git's configuration.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy --no-self-update
      - run: rustup default 1.96.0
      - run: cargo clippy --workspace --all-targets --locked --features bundled -- -D warnings
      - run: cargo test --workspace --locked --features bundled

  # The Developer Certificate of Origin, checked rather than asked for. Only on proposals:
  # the history before this workflow existed is unsigned and rewriting it would be worse
  # than leaving it visible.
  signed-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit certifies the DCO
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=$(git log --format='%h %s' --invert-grep -E --grep='^Signed-off-by: .+ <.+@.+>$' "$BASE".."$HEAD")
          if [ -n "$missing" ]; then
            echo "No Signed-off-by line on:"
            echo "$missing"
            echo "See the DCO file. Add one with 'git commit --amend -s', or 'git rebase --signoff $BASE' for several."
            exit 1
          fi
