<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>333 — nothing here</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light dark;
    --ground: #ffffff; --ink: #141414; --dim: #575757;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #0b0b0b; --ink: #ededed; --dim: #a6a6a6; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--ground); color: var(--dim);
    font: 1rem/1.7 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 2rem; text-align: center;
  }
  a { color: inherit; text-underline-offset: 4px; }
  p { max-width: 30rem; margin: 0 0 1rem; }
  .mark { font-size: 3.5rem; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; }
</style>
</head>
<body>
  <div>
    <p class="mark">333</p>
    <p>Nothing is kept at this address. Nothing is kept at any address — that is rather the
    point of it.</p>
    <p><a href="/">the333.dev</a></p>
  </div>
</body>
</html>
