[workspace]
resolver = "3"
members = ["crates/core", "crates/net", "crates/store", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# Declared as the toolchain this is actually built and tested on. The arti crates
# claim 1.91, but an MSRV nobody compiles is an untested claim.
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/needmoretruth/333"

[workspace.dependencies]
# --- protocol side -------------------------------------------------------------
# Pinned to the versions the arti 0.46.0 release train already pulls in, so the
# tree holds ONE copy of the dalek stack instead of two incompatible majors.
# ed25519-dalek 3.x / sha2 0.11 exist and are newer; adopting them means a second
# curve25519-dalek, a second sha2 and a second signature crate in every binary.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "rand_core", "zeroize"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false }
# postcard is the only serde binary format that documents a frozen wire format
# (stable since 1.0.0). The heartbeat encoding can never change after 3.3.3.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# --- transport side ------------------------------------------------------------
# Every arti crate is pinned to the exact same version. A caret range that resolves
# to a different minor produces two incompatible copies of DataStream and Connected.
# `compression` is off on purpose. It is a default feature, and it is the only reason
# this tree compiles C: it pulls zstd-sys and liblzma-sys, about 145,000 lines of
# vendored C, to make directory downloads smaller. Without it arti still advertises
# and decodes deflate, which is pure Rust — the cost is bandwidth on bootstrap, not a
# lost capability. `tokio` and `native-tls` are the other two defaults, kept.
arti-client = { version = "=0.46.0", default-features = false, features = [
    "tokio",
    "native-tls",
    "onion-service-service",
    "onion-service-client",
    "vanguards",
    # Bridges: relays that are not in the public directory, for a network where the
    # public ones are blocked. `pt-client` is what makes an obfs4 bridge line mean
    # anything; the program that speaks obfs4 is not bundled and is named in the
    # configuration, because shipping somebody else's censorship-circumvention binary
    # inside this is a promise about a moving target that this cannot keep.
    "bridge-client",
    "pt-client",
] }
tor-hsservice = "=0.46.0"
tor-cell = "=0.46.0"
tor-proto = { version = "=0.46.0", features = ["hs-service"] }
tor-rtcompat = "=0.46.0"
tor-error = "=0.46.0"
safelog = "0.9"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
# Bridges Tokio's socket traits to the futures ones arti's streams already speak, so
# one exchange is written once for both transports. Already in the tree; this only
# turns on a feature of it.
tokio-util = { version = "0.7", features = ["compat"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- where a node keeps its files ---------------------------------------------
# Both of these are already in the tree because arti uses them, so neither adds a
# dependency, a build or a licence to check.
# fs-mistrust is pinned exactly for the same reason the arti crates are: two copies
# would mean this client and arti disagreed about whether one directory is private.
# It checks the whole ancestry of a path, not just the file, which is the part a
# hand-written mode check gets wrong — a world-writable parent lets anyone replace
# the file inside it.
fs-mistrust = "=0.15.1"
# directories is what puts the node's home in the conventional place on each system
# instead of assuming the XDG variables exist. It is data only: no unsafe, no C.
directories = "6"

# --- finding each other on one network -----------------------------------------
# mDNS is how two nodes in the same house meet without anybody typing an invitation.
# Pure Rust, no async runtime of its own, and small: four crates, all already the kind
# of thing this tree carries. The `logging` default feature is off — everything this
# client has to say goes through its own voice, not through `log`.
mdns-sd = { version = "0.21.2", default-features = false, features = ["async"] }

# --- finding each other across two networks -------------------------------------
# One HTTPS request to the meeting point, and no more HTTP than that: leave a signed
# statement, read the ones left there, ask what address this node arrives from. ureq
# is blocking, which suits a call made once an epoch from a worker thread, and it is
# nine crates rather than the thirty a hyper-and-tower stack costs.
#
# It is the one place C is compiled on purpose. TLS is not something to write, and
# rustls has no production-ready pure-Rust cryptography provider, so `ring` comes in.
# The tor build already links OpenSSL through arti, so this is not a new kind of
# dependency — on the smallest edition, it is the only one.
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

# Pinned to what arti already resolves. They are declared only so that `--features
# bundled` can turn their vendoring on; nothing in this workspace calls either one.
libsqlite3-sys = "0.37.0"
openssl-sys = "0.9.117"

# --- the screen ----------------------------------------------------------------
# The Standard edition's screen. Pure Rust, and the only part of the client a person
# looks at for hours, which is why it is a library rather than hand-rolled escape
# codes: cursor handling, resizing and restoring a terminal after a crash are exactly
# the things a hand-rolled version gets wrong on somebody else's terminal.
# The calendar widget and the macros are left out; nothing here uses them.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }

n333-core = { path = "crates/core" }
# default-features off at the root so each edition names what it wants; the CLI
# turns "tor" back on through its own feature of the same name.
n333-net = { path = "crates/net", default-features = false }
n333-store = { path = "crates/store" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

# Dependencies are compiled with optimization even in dev builds. Without this the
# curve arithmetic runs unoptimized and one key pair costs milliseconds instead of
# microseconds, which turns the identity search from under a second into over a
# minute — and makes every test that touches a key look like a hang.
[profile.dev.package."*"]
opt-level = 3

# What is shipped. Debug symbols are a third of the binary and are of no use to
# somebody running it: whoever is debugging has the source and builds their own.
# One codegen unit and link-time optimisation are worth the slower build here and
# nowhere else, because this build happens once per release and runs for years.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
